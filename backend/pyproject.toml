[project]
name = "verytas"
version = "0.1.0"
description = "Pre-publication brand governance: cited checks, human review, and guidelines that learn where they are unclear."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "anthropic>=1.0",
    "httpx>=0.27",
    "cryptography>=43",
    "numpy>=2.0",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "sentry-sdk[fastapi]>=2.0",
    "redis>=5.2",                   # conversations: live delivery and a recent-message cache, optional
    # Local media stack: nothing here calls out to a service.
    "pypdfium2>=5.0",               # PDF text layers, page renders, embedded images
    "rapidocr>=3.10",               # OCR (PP-OCR models on onnxruntime, CPU)
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10", # brand-asset matching (SIFT, homography)
    "av>=14",                       # video decoding (FFmpeg bundled)
    "faster-whisper>=1.1",          # speech-to-text for video, runs locally
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verytas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Demo data is prose and long strings; wrapping them would hide what a post says.
"verytas/showcase/*.py" = ["E501"]
"tests/test_showcase.py" = ["E501"]
